---
- name: Actualiser les paquets de securite et systeme
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Installer les services et les dependances des modules
  ansible.builtin.apt:
    name:
      - docker.io
      - certbot
      - python3-docker
      - python3-pymongo
      - python3-requests
      - ufw
      - fail2ban
      - nginx
      - unattended-upgrades
    state: present

- name: Creer le compte de deploiement
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    create_home: true

- name: Installer la cle publique de deploiement
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_public_key }}"
    state: present

- name: Autoriser Ansible a administrer le serveur
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    content: "{{ deploy_user }} ALL=(root) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Creer le compte de service sans connexion
  ansible.builtin.user:
    name: logichain
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Securiser SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-logichain.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      MaxAuthTries 3
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Recharger SSH

- name: Autoriser SSH depuis le reseau d administration
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    from_ip: "{{ ssh_allowed_cidr }}"

- name: Autoriser HTTP et HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ['80', '443']

- name: Bloquer les connexions entrantes par defaut
  community.general.ufw:
    direction: incoming
    policy: deny
    state: enabled

- name: Activer la protection SSH Fail2Ban
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/logichain.local
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      findtime = 10m
      bantime = 1h
    owner: root
    group: root
    mode: '0644'
  notify: Redemarrer Fail2Ban

- name: Activer les services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [docker, fail2ban, unattended-upgrades]

- name: Creer les repertoires prives
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: [/etc/logichain, /var/backups/logichain]
